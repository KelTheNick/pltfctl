# Static upstream resolver, bind-mounted into every pltfctl node (see
# infra/k3d/<distro>/<cluster>.yaml `volumes:` + the k3s `--resolv-conf` extraArg).
#
# k3s's auto-detected node resolv.conf points at the Docker bridge gateway
# for the cluster's network (e.g. 192.168.97.1 for k3d-pltfctl). That address
# simply runs no DNS listener — confirmed with a *plain Docker container* on
# the same bridge, no Kubernetes and no Cilium involved at all: both a UDP
# `nslookup` and a TCP `nc -zv <gw> 53` time out / connection-refuse against
# it (`docker run --rm --network <net> busybox nc -zv -w3 <gw> 53` -> rc=1).
# This is a HOST fact, not a CNI one. An earlier version of this comment
# claimed Cilium's masquerade path silently black-holed pod traffic to the
# gateway specifically; that claim does not hold — a plain (non-hostNetwork)
# pod's `ping` to the same gateway address succeeds once Cilium owns the
# datapath, so Cilium is not what is standing between a pod and this address.
# The gateway was never a DNS server in the first place, for any caller,
# Cilium or not. CoreDNS's Corefile forwards to /etc/resolv.conf, which for a
# dnsPolicy:Default pod (CoreDNS itself) is the node's resolv.conf as
# configured by kubelet's --resolv-conf; pointing that at real, working
# resolvers instead of the silent gateway is what lets Flux's external
# Helm/OCI chart pulls (the kgateway HelmRepository) resolve and
# the fabric converge.
#
# Also probed but NOT adopted as the default here (a design call left to the
# coordinator, not decided by this comment): from a pod, the node's
# `# ExtServers: [host(...)]` address embedded in the auto-detected
# resolv.conf (OrbStack's own host resolver, e.g. 0.250.250.200) answers real
# queries. That would track whatever DNS the host actually uses, including a
# corporate/VPN resolver — worth revisiting as a smarter default. See the
# task-4-report.md "Fix round 1" section for the raw probe output.
#
# This is only the DEFAULT. On a corporate LAN, behind a VPN that blocks
# outbound :53 to public resolvers, on an air-gapped host, or to reach an
# internal-only chart source, set PLTF_RESOLV_CONF to another resolv.conf-
# format file before running pltfctl — see its Environment: entry in
# `scripts/pltfctl`'s usage(). Unset, this file is what gets mounted.
nameserver 1.1.1.1
nameserver 8.8.8.8
