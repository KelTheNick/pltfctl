---
# distro: lite (default) — one cluster, Cilium networking.  Context: k3d-lite
#
# TEMPLATE: every PLTF_* placeholder is filled from infra/k3d/fleet.env by
# envsubst at create time. fleet.env is authoritative for every value.
#
# Posture:
#   - Cilium CNI with kube-proxy replacement (eBPF); Flannel, kube-proxy and
#     the k3s NetworkPolicy controller are all disabled. Nodes stay NotReady
#     until `cilium install` runs.
#   - Creates the shared OCI registry.
#   - 1 server (tainted CriticalAddonsOnly) + 1 agent: workloads run on the
#     agent. Nothing here is HA. No ClusterMesh (plain Cilium).
#   - Gateway (kgateway) for host-network access; Traefik disabled.
#   - Workload-observability stack: declared (O11Y=true), not implemented yet.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: lite

image: rancher/k3s:$K3D_TAG

servers: 1
agents: 1

network: $PLTF_NETWORK

kubeAPI:
  host: "$PLTF_API_HOST"
  hostIP: "127.0.0.1"
  hostPort: "$PLTF_CLUSTER_API_PORT"

# k3d host port-maps can ONLY be declared at cluster-create, so HTTPS is
# reserved now even though no TLS listener exists yet.
ports:
  - port: $PLTF_CLUSTER_HTTP_PORT:80
    nodeFilters:
      - loadbalancer
  - port: $PLTF_CLUSTER_HTTPS_PORT:443
    nodeFilters:
      - loadbalancer

# Local OCI registry, created and removed with this cluster.
# Host: localhost:<REGISTRY_HOST_PORT>  In-cluster: <REGISTRY_NAME>:<REGISTRY_PORT>
# (k3d does NOT prefix the registry's own name with "k3d-").
registries:
  create:
    name: $PLTF_REGISTRY_NAME
    host: "0.0.0.0"
    hostPort: "$PLTF_REGISTRY_HOST_PORT"

# Static upstream resolver: the Docker bridge gateway k3s auto-detects runs
# no DNS listener, so external chart pulls would fail. See
# infra/k3d/network/resolv.conf.
volumes:
  - volume: $PLTF_RESOLV_CONF:/etc/pltfctl/resolv.conf:ro
    nodeFilters:
      - server:*
      - agent:*

options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --flannel-backend=none
        nodeFilters:
          - "server:*"
      - arg: --disable-network-policy
        nodeFilters:
          - "server:*"
      - arg: --disable-kube-proxy
        nodeFilters:
          - "server:*"
      - arg: --disable=traefik
        nodeFilters:
          - "server:*"
      - arg: --cluster-cidr=$PLTF_CLUSTER_POD_CIDR
        nodeFilters:
          - "server:*"
      - arg: --service-cidr=$PLTF_CLUSTER_SVC_CIDR
        nodeFilters:
          - "server:*"
      - arg: --cluster-dns=$PLTF_CLUSTER_DNS_IP
        nodeFilters:
          - "server:*"
      - arg: --resolv-conf=/etc/pltfctl/resolv.conf
        nodeFilters:
          - "server:*"
          - "agent:*"
      # Server runs the control plane + system add-ons only; workloads run on
      # the agent.
      - arg: --node-taint=CriticalAddonsOnly=true:NoSchedule
        nodeFilters:
          - "server:*"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
