---
# distro: lite — one cluster, k3s-native networking.  Context: k3d-lite
#
# TEMPLATE: every PLTF_* placeholder is filled from infra/fleet.env by
# envsubst at create time. fleet.env is authoritative for every value.
#
# Posture:
#   - Flannel CNI + kube-proxy, both k3s defaults. No Cilium, no mesh.
#   - No registry.
#   - Traefik disabled: the Gateway (kgateway) is the only way in from the
#     host network, on the LB port below.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: lite

image: rancher/k3s:$K3D_TAG

servers: 1
agents: 0

network: $PLTF_NETWORK

kubeAPI:
  host: "$PLTF_API_HOST"
  hostIP: "127.0.0.1"
  hostPort: "$PLTF_CLUSTER_API_PORT"

# k3d host port-maps can ONLY be declared at cluster-create, so HTTPS is
# reserved now even though no TLS listener exists yet.
ports:
  - port: $PLTF_CLUSTER_HTTP_PORT:80
    nodeFilters:
      - loadbalancer
  - port: $PLTF_CLUSTER_HTTPS_PORT:443
    nodeFilters:
      - loadbalancer

# Static upstream resolver: the Docker bridge gateway k3s auto-detects runs
# no DNS listener, so external chart pulls would fail. A host fact, not a
# CNI one — needed here too. See infra/network/resolv.conf.
volumes:
  - volume: $PLTF_RESOLV_CONF:/etc/pltfctl/resolv.conf:ro
    nodeFilters:
      - server:*

options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - "server:*"
      - arg: --cluster-cidr=$PLTF_CLUSTER_POD_CIDR
        nodeFilters:
          - "server:*"
      - arg: --service-cidr=$PLTF_CLUSTER_SVC_CIDR
        nodeFilters:
          - "server:*"
      - arg: --cluster-dns=$PLTF_CLUSTER_DNS_IP
        nodeFilters:
          - "server:*"
      - arg: --resolv-conf=/etc/pltfctl/resolv.conf
        nodeFilters:
          - "server:*"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
