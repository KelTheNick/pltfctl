# distro: dev, variant aiven-tiered — Apache Kafka with tiered storage
# (KIP-405) on RustFS, as a Docker Compose stack. Selected by
# VARIANT_KAFKA=aiven-tiered (infra/compose/.variant.env).
#
# Run by `pltfctl up dev` as `docker compose -p $PLTF_DEV_PROJECT -f <this>`.
# Every ${VAR} is Compose's own interpolation: images and the plugin version
# come from .env.sbom and ports from infra/k3d/fleet.env, both exported by
# scripts/pltfctl. Run it by hand only through pltfctl, or those values are
# unset.
#
# Posture:
#   - One upstream Apache Kafka node, controller + broker (KRaft). Recent
#     segments live on its local volume; tiered storage is always on at the
#     broker, and every topic created with remote.storage.enable=true ships
#     closed segments to bucket kafka-tiered in RustFS. Shared-nothing with
#     object-storage retention, not shared-data: see
#     wiki/architect/01-event-bus-storage.md
#   - The remote storage manager is Aiven's tiered-storage plugin (Apache 2.0),
#     downloaded once into a volume and checksum-verified; Kafka loads it from
#     remote.log.storage.manager.class.path. No custom Kafka image.
#   - RustFS is the S3 store: one container, one named volume. Chosen over
#     Apache Ozone, which needs a manager, a storage-container manager, an S3
#     gateway and datanodes. See wiki/developer/02-aiven-tiered.md
#   - Everything binds 127.0.0.1. Credentials are local throwaways; override
#     them with PLTF_DEV_S3_ACCESS_KEY / PLTF_DEV_S3_SECRET_KEY.

services:
  rustfs:
    image: ${RUSTFS_IMAGE:?set by scripts/pltfctl from .env.sbom}
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
    ports:
      - 127.0.0.1:${PLTF_DEV_S3_PORT:?}:9000
      - 127.0.0.1:${PLTF_DEV_S3_CONSOLE_PORT:?}:9001
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # One-shot: create the tiered-storage bucket, then exit 0. Retries until
  # RustFS answers, so RustFS needs no healthcheck (its image is not
  # guaranteed to ship curl).
  buckets:
    image: ${MC_IMAGE:?set by scripts/pltfctl from .env.sbom}
    depends_on:
      - rustfs
    environment:
      S3_KEY: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set s3 http://rustfs:9000 "$$S3_KEY" "$$S3_SECRET" >/dev/null 2>&1; do
          i=$$((i + 1)); [ "$$i" -lt 60 ] || { echo 'RustFS never answered'; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing s3/kafka-tiered
    restart: "no"

  # One-shot: fetch Aiven's tiered-storage plugin (core + S3 backend) into the
  # ts-plugin volume, verify each tarball against the SHA-256 pinned in
  # .env.sbom, and unpack. Skipped when that version is already unpacked, so
  # only the first `up` downloads (~100 MB).
  plugin:
    image: ${CURL_IMAGE:?set by scripts/pltfctl from .env.sbom}
    user: "0"
    environment:
      V: ${TS_PLUGIN_VERSION:?}
      CORE_SHA: ${TS_PLUGIN_CORE_SHA256:?}
      S3_SHA: ${TS_PLUGIN_S3_SHA256:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /plugin
        [ -f "ok-$$V" ] && exit 0
        rm -rf ./*
        base=https://github.com/Aiven-Open/tiered-storage-for-apache-kafka/releases/download/v$$V
        for p in core s3; do curl -fsSL -o "$$p.tgz" "$$base/$$p-$$V.tgz"; done
        printf '%s  core.tgz\n%s  s3.tgz\n' "$$CORE_SHA" "$$S3_SHA" | sha256sum -c -
        for p in core s3; do tar xzf "$$p.tgz" && mv "$$p-$$V" "$$p" && rm "$$p.tgz"; done
        touch "ok-$$V"
    volumes:
      - ts-plugin:/plugin
    restart: "no"

  kafka:
    image: ${KAFKA_IMAGE:?set by scripts/pltfctl from .env.sbom}
    hostname: kafka
    depends_on:
      buckets:
        condition: service_completed_successfully
      plugin:
        condition: service_completed_successfully
    stop_grace_period: 1m
    environment:
      # Fixed, so the local volume's metadata survives a restart. Any base64
      # UUID works (kafka-storage.sh random-uuid).
      CLUSTER_ID: 3D4fXN-yS1-vsQ8aJ_q4Mg
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: PLAINTEXT for containers on this network
      # (kafka:9092), EXTERNAL for the host (localhost:$PLTF_DEV_KAFKA_PORT).
      # A broker hands clients the advertised address, so one listener cannot
      # serve both.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${PLTF_DEV_KAFKA_PORT:?}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: nothing to replicate to.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # --- Tiered storage (KIP-405), always on at the broker -----------------
      KAFKA_REMOTE_LOG_STORAGE_SYSTEM_ENABLE: "true"
      KAFKA_REMOTE_LOG_MANAGER_TASK_INTERVAL_MS: 5000
      # Retention runs every 10s, not 5m, so a segment whose local retention
      # has passed is deleted locally soon after it is tiered (verify relies
      # on this). Costs nothing at laptop scale.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
      KAFKA_REMOTE_LOG_METADATA_MANAGER_LISTENER_NAME: PLAINTEXT
      KAFKA_RLMM_CONFIG_REMOTE_LOG_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_PATH: /opt/tiered-storage/core/*:/opt/tiered-storage/s3/*
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_NAME: io.aiven.kafka.tieredstorage.RemoteStorageManager
      KAFKA_RSM_CONFIG_CHUNK_SIZE: 4194304
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_CLASS: io.aiven.kafka.tieredstorage.fetch.cache.MemoryChunkCache
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_SIZE: 134217728
      KAFKA_RSM_CONFIG_FETCH_CHUNK_CACHE_PREFETCH_MAX_SIZE: 16777216
      KAFKA_RSM_CONFIG_STORAGE_BACKEND_CLASS: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
      KAFKA_RSM_CONFIG_STORAGE_S3_ENDPOINT_URL: http://rustfs:9000
      KAFKA_RSM_CONFIG_STORAGE_S3_BUCKET_NAME: kafka-tiered
      KAFKA_RSM_CONFIG_STORAGE_S3_REGION: us-east-1
      KAFKA_RSM_CONFIG_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      KAFKA_RSM_CONFIG_STORAGE_AWS_ACCESS_KEY_ID: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      KAFKA_RSM_CONFIG_STORAGE_AWS_SECRET_ACCESS_KEY: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
    ports:
      - 127.0.0.1:${PLTF_DEV_KAFKA_PORT:?}:9094
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ts-plugin:/opt/tiered-storage:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  rustfs-data:
  kafka-data:
  ts-plugin:
