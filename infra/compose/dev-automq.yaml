# distro: dev, variant automq — AutoMQ (Kafka on S3) over RustFS: shared-data.
# Selected by VARIANT_KAFKA=automq (infra/compose/.variant.env).
#
# Run by `pltfctl up dev` as `docker compose -p $PLTF_DEV_PROJECT -f <this>`.
# The service is named `kafka` in every variant, so pltfctl's commands do not
# care which one runs.
# Every ${VAR} is Compose's own interpolation: images come from .env.sbom and
# ports from infra/k3d/fleet.env, both exported by scripts/pltfctl. Run it by hand
# only through pltfctl, or those values are unset.
#
# Posture:
#   - One AutoMQ node, controller + broker (KRaft). Its log lives in S3, not
#     on a local disk: data and WAL in bucket automq-data, metrics and logs in
#     automq-ops. Replication is S3's job, so one broker loses nothing when it
#     restarts.
#   - RustFS is the S3 store: one container, one named volume. Chosen over
#     Apache Ozone, which needs a manager, a storage-container manager, an S3
#     gateway and datanodes. See wiki/developer/02-aiven-tiered.md
#   - Everything binds 127.0.0.1. Credentials are local throwaways; override
#     them with PLTF_DEV_S3_ACCESS_KEY / PLTF_DEV_S3_SECRET_KEY.

services:
  rustfs:
    image: ${RUSTFS_IMAGE:?set by scripts/pltfctl from .env.sbom}
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
    ports:
      - 127.0.0.1:${PLTF_DEV_S3_PORT:?}:9000
      - 127.0.0.1:${PLTF_DEV_S3_CONSOLE_PORT:?}:9001
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # One-shot: create the two buckets AutoMQ needs, then exit 0. AutoMQ starts
  # only after it succeeds. Retries until RustFS answers, so RustFS needs no
  # healthcheck (its image is not guaranteed to ship curl).
  buckets:
    image: ${MC_IMAGE:?set by scripts/pltfctl from .env.sbom}
    depends_on:
      - rustfs
    environment:
      S3_KEY: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set s3 http://rustfs:9000 "$$S3_KEY" "$$S3_SECRET" >/dev/null 2>&1; do
          i=$$((i + 1)); [ "$$i" -lt 60 ] || { echo 'RustFS never answered'; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing s3/automq-data s3/automq-ops
    restart: "no"

  kafka:
    image: ${AUTOMQ_IMAGE:?set by scripts/pltfctl from .env.sbom}
    hostname: kafka
    depends_on:
      buckets:
        condition: service_completed_successfully
    stop_grace_period: 1m
    environment:
      KAFKA_S3_ACCESS_KEY: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      KAFKA_S3_SECRET_KEY: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
      AWS_ACCESS_KEY_ID: ${PLTF_DEV_S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${PLTF_DEV_S3_SECRET_KEY:-rustfsadmin}
      # Below AutoMQ's quick-start 1g/4g heap: a laptop stack, not a benchmark.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1G
      # Fixed: the cluster's metadata lives in S3, so a new ID on restart
      # would orphan it. Any base64 UUID works (kafka-storage.sh random-uuid).
      CLUSTER_ID: 3D4fXN-yS1-vsQ8aJ_q4Mg
    # Two client listeners: PLAINTEXT for containers on this network
    # (kafka:9092), EXTERNAL for the host (localhost:$PLTF_DEV_KAFKA_PORT).
    # A broker hands clients the advertised address, so one listener cannot
    # serve both.
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=0 \
        --override process.roles=broker,controller \
        --override controller.quorum.voters=0@kafka:9093 \
        --override controller.quorum.bootstrap.servers=kafka:9093 \
        --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094 \
        --override listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT \
        --override advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:${PLTF_DEV_KAFKA_PORT:?} \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true'
    ports:
      - 127.0.0.1:${PLTF_DEV_KAFKA_PORT:?}:9094
    healthcheck:
      test: ["CMD-SHELL", "/opt/automq/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  rustfs-data:
