# distro: dev, variant strimzi-kraft (default) — Strimzi's Kafka image in KRaft
# mode, on a local volume: plain shared-nothing. Selected by
# VARIANT_KAFKA=strimzi-kraft (infra/compose/.variant.env).
#
# Run by `pltfctl up dev` as `docker compose -p $PLTF_DEV_PROJECT -f <this>`.
# Every ${VAR} is Compose's own interpolation, exported by scripts/pltfctl.
# The service is named `kafka` in every variant, so pltfctl's commands do not
# care which one runs.
#
# Posture:
#   - The same Kafka build the lite distro's Strimzi operator runs
#     (quay.io/strimzi/kafka:<STRIMZI_VERSION>-kafka-<KAFKA_VERSION>, derived
#     from .env.sbom), started by hand: no operator, no CRDs, no Kubernetes.
#     Closest laptop match to lite's broker without a cluster.
#   - One controller + broker node, data on the kafka-data volume.
#   - Everything binds 127.0.0.1. PLAINTEXT, no authentication.

services:
  # One-shot: the image runs as uid 1001, but a fresh named volume is owned by
  # root. Hand it to 1001 once, so Kafka itself never runs as root.
  data-owner:
    image: ${STRIMZI_KAFKA_IMAGE:?set by scripts/pltfctl from .env.sbom}
    user: "0"
    entrypoint: ["sh", "-c", "chown -R 1001:0 /var/lib/kafka"]
    volumes:
      - kafka-data:/var/lib/kafka
    restart: "no"

  kafka:
    image: ${STRIMZI_KAFKA_IMAGE:?set by scripts/pltfctl from .env.sbom}
    hostname: kafka
    depends_on:
      data-owner:
        condition: service_completed_successfully
    stop_grace_period: 1m
    environment:
      # Fixed, so the volume's metadata survives a restart. Any base64 UUID
      # works (kafka-storage.sh random-uuid).
      CLUSTER_ID: 3D4fXN-yS1-vsQ8aJ_q4Mg
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
      # kafka-run-class.sh writes server and GC logs to $LOG_DIR, by default
      # /opt/kafka/logs, which uid 1001 cannot create.
      LOG_DIR: /tmp/kafka-logs
      HOST_PORT: ${PLTF_DEV_KAFKA_PORT:?}
    # The image has no entrypoint: write a KRaft config, format the log dir
    # once (--ignore-formatted makes restarts a no-op), then start. Two client
    # listeners: PLAINTEXT for containers on this network (kafka:9092),
    # EXTERNAL for the host (localhost:$PLTF_DEV_KAFKA_PORT).
    entrypoint:
      - bash
      - -c
      - |
        set -e
        cat >/tmp/server.properties <<EOF
        node.id=1
        process.roles=broker,controller
        controller.quorum.voters=1@kafka:9093
        controller.listener.names=CONTROLLER
        listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
        advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:$$HOST_PORT
        listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
        inter.broker.listener.name=PLAINTEXT
        log.dirs=/var/lib/kafka/data
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        default.replication.factor=1
        min.insync.replicas=1
        EOF
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
          -t "$$CLUSTER_ID" -c /tmp/server.properties
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
    ports:
      - 127.0.0.1:${PLTF_DEV_KAFKA_PORT:?}:9094
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-data:
