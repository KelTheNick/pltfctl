# Strimzi cluster operator. Source (HelmRepository `strimzi`) lives in
# repositories.yaml.
#
# Namespace-scoped: watchNamespaces lists only kafka-system. This release is
# the first operator and owns what the 'upgrade' bus's operator reuses
# (kafka-upgrade/strimzi-operator.yaml): the CRDs and the cluster-wide
# ClusterRoles, so it must outlive that one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-operator
  namespace: kafka-system
spec:
  interval: 10m
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: strimzi-cluster-operator
    watchNamespaces:
      - kafka-system
