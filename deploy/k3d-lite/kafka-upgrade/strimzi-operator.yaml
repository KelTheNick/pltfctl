# A second, namespace-scoped Strimzi cluster operator, for the 'upgrade' bus.
# Source (HelmRepository `strimzi`) lives in repositories.yaml.
#
# It shares what the kafka-system release already installed, so it must be
# installed second and removed first (`pltfctl event-bus up upgrade` checks):
#   - CRDs: installed once, by kafka-system's release (crds: CreateReplace).
#     This release skips them (crds: Skip), so both operators use one set.
#   - ClusterRoles (strimzi-cluster-operator-global, -namespaced, -watched,
#     strimzi-kafka-broker, strimzi-entity-operator, strimzi-kafka-client):
#     fixed names, so a second release creating them would collide.
#     createGlobalResources: false leaves them to kafka-system's release; the
#     chart still creates this namespace's RoleBindings to them.
# Scope: watchNamespaces lists only kafka-upgrade, so this operator reconciles
# nothing in kafka-system, and kafka-system's operator nothing here.
#
# The chart's one cluster-wide binding (strimzi-cluster-operator, on
# createGlobalResources) is not created either, which would deny this
# operator `storageclasses get` (volume resize checks) and `nodes list`
# (NodePort listeners). The ClusterRoleBinding below restores them. The
# rack-awareness and kafka-client delegation bindings are not restored: this
# platform uses neither.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-operator
  namespace: kafka-upgrade
spec:
  interval: 10m
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
  values:
    fullnameOverride: strimzi-cluster-operator
    watchNamespaces:
      - kafka-upgrade
    createGlobalResources: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strimzi-cluster-operator-kafka-upgrade
subjects:
  - kind: ServiceAccount
    name: strimzi-cluster-operator
    namespace: kafka-upgrade
roleRef:
  kind: ClusterRole
  name: strimzi-cluster-operator-global
  apiGroup: rbac.authorization.k8s.io
