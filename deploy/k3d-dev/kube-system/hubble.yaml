# Hubble UI route. Hubble itself (relay + UI) is installed by cilium-cli as
# part of the Cilium Helm release — NOT by Flux — because the CNI must exist
# before Flux can run, and two controllers reconciling one Helm release would
# fight. Flux owns only this route to the Service that release creates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: gw-api-kgateway
      sectionName: http
  hostnames:
    - ${PLTF_HOST_PREFIX}hubble.k3d.workbench.local.gd
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
