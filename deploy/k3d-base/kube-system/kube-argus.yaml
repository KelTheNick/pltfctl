# kube-argus dashboard release. Source (HelmRepository `kube-argus`) lives in
# repositories.yaml.
#
# Mirrors the fabric's pltf-observability kube-argus posture (subchart v1.2.5,
# ClusterIP :8080, HTTPRoute at argus.k3d.workbench.local.gd on gw-api-kgateway)
# but as a standalone Flux release. Values live in a ConfigMap referenced via
# .spec.valuesFrom, the GitOps analog of the fabric's env/<env>/values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-argus-values
  namespace: kube-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    replicaCount: 1
    # Pin the release name so the Service is a predictable `kube-argus`
    # (the HTTPRoute backend below).
    fullnameOverride: kube-argus
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    env:
      CLUSTER_NAME: workbench-local
      DEFAULT_ROLE: viewer
      LOG_LEVEL: info
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-argus
  namespace: kube-system
spec:
  interval: 10m
  # Correct drift, but leave replicas alone, so an HPA (or a manual `kubectl scale`)
  # is not reverted on the next reconcile.
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  chart:
    spec:
      chart: kube-argus
      version: "1.2.5"
      sourceRef:
        kind: HelmRepository
        name: kube-argus
        namespace: flux-system
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: kube-argus-values
---
# Exposes kube-argus through the kgateway Gateway (gateway.yaml) at
# argus.k3d.workbench.local.gd on host :80; the dashboard lands at
# http://[<prefix>-]argus.k3d.workbench.local.gd:<lb-port> (see infra/fleet.env).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-argus
  namespace: kube-system
spec:
  parentRefs:
    - name: gw-api-kgateway
      sectionName: http
  hostnames:
    - ${PLTF_HOST_PREFIX}argus.k3d.workbench.local.gd
  rules:
    - backendRefs:
        - name: kube-argus
          port: 8080
