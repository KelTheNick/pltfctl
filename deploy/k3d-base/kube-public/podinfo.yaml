# Sample application: the one server `verify` and the gateway smoke route
# test against. HTTP (9898), TLS (9899) and gRPC (9999) from one podinfo
# process; TCP is verified with a raw socket to 9898.
#
# Lives in kube-public because it is a workload deployed ONTO the platform to
# exercise it, not part of the platform itself (everything in kube-system is).
# kube-public is world-readable by default — only ever put throwaway echo
# workloads here.
#
# A StatefulSet, not a Deployment: the per-pod
# <pod>.<cluster>.<svc>.<ns>.svc.clusterset.local record only exists when the
# backing EndpointSlice entry carries a hostname, which comes from stable pod
# naming. Deployment pods have random suffixes and no hostname.
#
# The cluster name is NOT hardcoded — this manifest is applied unchanged to
# every cluster and reads its identity from the pltf-cluster-info ConfigMap
# that cmd_up writes per cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podinfo
  namespace: kube-public
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/component: mesh-test
spec:
  serviceName: podinfo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          imagePullPolicy: IfNotPresent
          # The image's ENTRYPOINT is empty and its CMD is ["./podinfo"].
          # Passing bare flags as args would REPLACE the command and leave the
          # container stuck in Created with no logs — command must be set here.
          command: ["./podinfo"]
          args:
            - --port=9898
            - --secure-port=9899
            - --cert-path=/certs
            - --grpc-port=9999
            - --grpc-service-name=$(PLTF_CLUSTER)
            - --ui-message=$(PLTF_CLUSTER)
          env:
            # Expanded into --ui-message (HTTP/TLS/TCP answers name the
            # cluster) and --grpc-service-name (gRPC health is SERVING only
            # for this cluster's name).
            - name: PLTF_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: pltf-cluster-info
                  key: cluster
          ports:
            - name: http
              containerPort: 9898
            - name: https
              containerPort: 9899
            - name: grpc
              containerPort: 9999
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: certs
              mountPath: /certs
      volumes:
        # Self-signed cert generated by `pltfctl up` (pltf_apply_podinfo_tls),
        # so no openssl image runs in-cluster. Secret files mount 0644, which
        # podinfo's non-root user can read.
        - name: certs
          secret:
            secretName: podinfo-tls
---
# ClusterIP, not headless: Cilium global services require a ClusterIP. The
# StatefulSet still stamps spec.hostname on each pod, so EndpointSlices carry
# the hostnames the per-pod clusterset records are built from.
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: kube-public
  labels:
    app.kubernetes.io/name: podinfo
  annotations:
    service.cilium.io/global: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
    - name: https
      port: 9899
      targetPort: https
    - name: grpc
      port: 9999
      targetPort: grpc
---
# Smoke route: podinfo behind the shared Gateway, so a data-plane request
# can be verified end-to-end from the host. Attaches across namespaces to
# gw-api-kgateway (kube-system), whose listener allows routes from All.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: kube-public
spec:
  parentRefs:
    - name: gw-api-kgateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - ${PLTF_HOST_PREFIX}podinfo.k3d.workbench.local.gd
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
